<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IRON WOD Cast Sender Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      max-width: 760px;
      margin: 40px auto;
      padding: 24px;
    }
    .card {
      background: #1b1b1b;
      border-radius: 18px;
      padding: 24px;
    }
    h1 { margin-top: 0; }
    code {
      background: #2a2a2a;
      padding: 3px 7px;
      border-radius: 6px;
    }
    google-cast-launcher {
      width: 64px;
      height: 64px;
      --connected-color: #ff6b00;
      --disconnected-color: white;
      display: inline-block;
      margin: 16px 0;
    }
    #status {
      margin-top: 16px;
      white-space: pre-wrap;
      color: #ccc;
      font-size: 14px;
    }
  </style>

  <script>
    const APP_ID = '2A6B3276';

    window.__onGCastApiAvailable = function(isAvailable) {
      const status = document.getElementById('status');
      if (!isAvailable) {
        status.textContent = 'Google Cast Web Sender SDK non disponibile.';
        return;
      }

      const castContext = cast.framework.CastContext.getInstance();
      castContext.setOptions({
        receiverApplicationId: APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
      });

      status.textContent =
        'Cast SDK inizializzato.\nReceiver Application ID: ' + APP_ID +
        '\nPremi il pulsante Cast qui sopra.';

      castContext.addEventListener(
        cast.framework.CastContextEventType.SESSION_STATE_CHANGED,
        function(event) {
          status.textContent += '\nSession state: ' + event.sessionState;
        }
      );
    };
  </script>

  <script
    src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1">
  </script>
</head>
<body>
  <div class="card">
    <h1>IRON WOD Cast Sender Test</h1>
    <p>Receiver: <code>2A6B3276</code></p>
    <p>Questo pulsante usa il Google Cast Web Sender SDK e prova ad avviare il Custom Web Receiver registrato.</p>
    <google-cast-launcher></google-cast-launcher>
    <div id="status">Caricamento Cast SDK…</div>
  </div>
</body>
</html>
