<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>IRON WOD Timer</title>
  <link rel="stylesheet" href="receiver.css">
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <main id="timerScreen" class="timer-screen state-idle">
    <div id="roundText" class="round-label hidden"></div>

    <div id="statusText" class="status">IRON WOD</div>

    <div id="timerText" class="timer led-timer" aria-label="00:00"></div>

    <div id="timeCapText" class="time-cap hidden"></div>

    <div id="footerText" class="footer">TIMER</div>
  </main>

  <script src="receiver.js"></script>
</body>
</html>
