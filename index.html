<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>IRON WOD Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="receiver.css?v=20260827-6">
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <!--
    SOURCE LAYER
    These are the exact DOM ids expected by the proven working receiver.js.
    receiver.js owns them completely. The LED code NEVER writes here.
  -->
  <div id="receiverSource" class="receiver-source" aria-hidden="true">
    <div id="statusText">IRON WOD</div>
    <div id="timerText">00:00</div>
    <div id="timeCapText" class="hidden"></div>
    <div id="footerText">TIMER</div>
  </div>

  <!-- STANDBY LAYER: visible only when no timer is active. -->
  <section id="standbyScreen" class="standby-screen" aria-label="IRON WOD standby">
    <img class="standby-logo" src="iron_wod_logo.png" alt="IRON WOD">
    <div id="standbyClock" class="standby-clock">00:00:00</div>
    <div class="standby-date-group">
      <div id="standbyWeekday" class="standby-weekday"></div>
      <div id="standbyDate" class="standby-date"></div>
    </div>
  </section>

  <!-- VISUAL-ONLY LED MIRROR -->
  <main id="ledScreen" class="timer-screen state-idle">
    <div id="ledTopCounter" class="top-counter hidden"></div>
    <div id="ledStatus" class="status">IRON WOD</div>
    <div id="ledTimer" class="timer" aria-label="00:00"></div>
    <div id="ledTimeCap" class="time-cap hidden"></div>
    <div id="ledFooter" class="footer">TIMER</div>
  </main>

  <!-- Working Cast receiver FIRST. -->
  <script src="receiver.js?v=20260827-6"></script>

  <!-- Visual mirror only; it has no Cast namespace/listener/context code. -->
  <script src="led-display.js?v=20260827-6"></script>
  <script src="standby.js?v=20260827-6"></script>
</body>
</html>
