<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>IRON WOD Timer</title>
  <!-- Space Mono / Rajdhani are bundled locally via @font-face in receiver.css
       (fonts/) instead of Google Fonts - see the comment there. -->
  <link rel="stylesheet" href="receiver.css?v=20260904-6">
</head>
<body>
  <!--
    SOURCE LAYER
    These are the exact DOM ids expected by receiver.js. receiver.js owns
    them completely. The LED code NEVER writes here.
  -->
  <div id="receiverSource" class="receiver-source" aria-hidden="true">
    <div id="statusText">IRON WOD</div>
    <div id="timerText">00:00</div>
    <div id="timeCapText" class="hidden"></div>
    <div id="footerText">TIMER</div>
    <!-- Only ever populated on the local HDMI Presentation build of this same
         bundle (never sent over the real Cast Message Channel) - see
         led-display.js. Stays empty here, which is the correct/expected
         state for a real Cast session. -->
    <div id="screenKindText" class="hidden"></div>
  </div>

  <!-- STANDBY LAYER: visible only when no timer is active. -->
  <section id="standbyScreen" class="standby-screen" aria-label="IRON WOD standby">
    <img class="standby-logo" src="iron_wod_logo.png" alt="IRON WOD">
    <div id="standbyClock" class="standby-clock">00:00:00</div>
    <div class="standby-date-group">
      <div id="standbyWeekday" class="standby-weekday"></div>
      <div id="standbyDate" class="standby-date"></div>
    </div>
  </section>

  <!-- VISUAL-ONLY LED MIRROR -->
  <main id="ledScreen" class="timer-screen state-idle">
    <div id="ledTopCounter" class="top-counter hidden"></div>
    <div id="ledStatus" class="status">IRON WOD</div>
    <div id="ledTimer" class="timer" aria-label="00:00"></div>
    <div id="ledTimeCap" class="time-cap hidden"></div>
    <div id="ledFooter" class="footer">TIMER</div>
  </main>

  <!-- CAF SDK must load BEFORE receiver.js, so window.cast.framework already
       exists when receiver.js checks for it and wires up the Cast Message
       Channel (IronCastProtocol.NAMESPACE in the app). This bundle is kept
       byte-for-byte in sync with the IronWOD app's local HDMI Presentation
       build (src/main/assets/cast_receiver/); the CAF script tag here is the
       only intentional difference. -->
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="receiver.js?v=20260904-1"></script>

  <!-- Visual mirror only; it has no Cast namespace/listener/context code. -->
  <script src="led-display.js?v=20260904-9"></script>
  <script src="standby.js?v=20260830-12"></script>
</body>
</html>
