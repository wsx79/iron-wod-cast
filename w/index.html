<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark only">
<meta name="robots" content="noindex">
<title>IRON WOD · WOD condiviso</title>
<meta name="description" content="Un WOD condiviso da IRON WOD: aprilo nell'app per allenarti con lo stesso workout.">
<meta property="og:title" content="IRON WOD · WOD condiviso">
<meta property="og:description" content="Aprilo in IRON WOD per allenarti con lo stesso workout.">
<meta property="og:image" content="https://wsx79.github.io/iron-wod-cast/iron_wod_logo.png">
<link rel="icon" href="../iron_wod_logo.png">
<style>
  :root {
    --bg: #0b0b0d;
    --surface: #151518;
    --surface-2: #1d1d21;
    --border: #2a2a30;
    --orange: #ff6a00;
    --orange-soft: #ff8a3d;
    --blue: #3b82f6;
    --text: #f7f7f8;
    --muted: #a8a8b0;
    color-scheme: dark only;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-weight: 900; letter-spacing: .02em; }
  .brand img { width: 36px; height: 36px; border-radius: 9px; }
  .brand b { color: var(--orange); }
  .kicker { margin: 28px 0 4px; color: var(--orange); font-weight: 900; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.15; overflow-wrap: anywhere; }
  .lead { margin: 0 0 20px; color: var(--muted); }
  .actions { display: grid; gap: 10px; margin: 0 0 24px; }
  .btn {
    display: block; text-align: center; text-decoration: none; font-weight: 900; font-size: 16px;
    padding: 14px 16px; border-radius: 16px; border: 1px solid var(--border); color: var(--text); background: var(--surface);
  }
  .btn.primary { background: var(--orange); border-color: var(--orange); color: #000; }
  .block { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; margin: 0 0 12px; }
  .block.rest { border-color: rgba(59, 130, 246, .5); }
  .block-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; margin: 0 0 8px; }
  .type { font-weight: 900; color: var(--orange-soft); letter-spacing: .04em; }
  .block.rest .type { color: var(--blue); }
  .meta { color: var(--muted); font-weight: 700; font-size: 14px; }
  .label { font-weight: 800; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 7px 0; border-top: 1px solid var(--surface-2); overflow-wrap: anywhere; }
  li:first-child { border-top: 0; }
  .dose { font-weight: 900; }
  .note { display: block; color: var(--muted); font-size: 14px; }
  .notes { color: var(--muted); white-space: pre-line; margin: 0 0 16px; }
  .error { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px 16px; }
  footer { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; }
  footer a { color: var(--orange-soft); }
</style>
</head>
<body>
<main>
  <a class="brand" href="../"><img src="../iron_wod_logo.png" alt=""><span>IRON <b>WOD</b></span></a>
  <div id="app"></div>
  <footer><a id="guide" href="../guida/">IRON WOD</a></footer>
</main>
<script>
(function () {
  "use strict";
  var PLAY = "https://play.google.com/store/apps/details?id=com.ironwod.app";
  var UI = {
    it: {
      kicker: "WOD condiviso", lead: "Ti hanno mandato questo WOD. Aprilo in IRON WOD per controllarlo, salvarlo e farlo partire col timer.",
      open: "Apri in IRON WOD", get: "Scarica IRON WOD da Google Play",
      rounds: function (n) { return n === 1 ? "1 round" : n + " round"; },
      every: "ogni", cap: "time cap", rest: "Recupero", restAfter: "recupero dopo", work: "lavoro", off: "pausa", wait: "partenza manuale",
      bad: "Questo link non contiene un WOD leggibile. Chiedi a chi te l'ha mandato di condividerlo di nuovo dall'app.",
      old: "Questo WOD è stato creato con una versione più recente di IRON WOD: aprilo nell'app aggiornata.",
      guide: "Guida a IRON WOD"
    },
    en: {
      kicker: "Shared WOD", lead: "Someone sent you this WOD. Open it in IRON WOD to review it, save it and start it on the timer.",
      open: "Open in IRON WOD", get: "Get IRON WOD on Google Play",
      rounds: function (n) { return n === 1 ? "1 round" : n + " rounds"; },
      every: "every", cap: "time cap", rest: "Rest", restAfter: "rest after", work: "work", off: "rest", wait: "manual start",
      bad: "This link doesn't contain a readable WOD. Ask the sender to share it again from the app.",
      old: "This WOD was made with a newer IRON WOD: open it in the updated app.",
      guide: "IRON WOD guide"
    },
    es: {
      kicker: "WOD compartido", lead: "Te han enviado este WOD. Ábrelo en IRON WOD para revisarlo, guardarlo e iniciarlo con el temporizador.",
      open: "Abrir en IRON WOD", get: "Descargar IRON WOD en Google Play",
      rounds: function (n) { return n === 1 ? "1 ronda" : n + " rondas"; },
      every: "cada", cap: "time cap", rest: "Descanso", restAfter: "descanso después", work: "trabajo", off: "descanso", wait: "inicio manual",
      bad: "Este enlace no contiene un WOD legible. Pide a quien te lo envió que lo comparta de nuevo desde la app.",
      old: "Este WOD se creó con una versión más reciente de IRON WOD: ábrelo en la app actualizada.",
      guide: "Guía de IRON WOD"
    }
  };
  var TYPES = { AMRAP: "AMRAP", EMOM: "EMOM", TABATA: "TABATA", INTERVALS: "INTERVALS", MANUAL_INTERVALS: "MANUAL INTERVALS", FOR_TIME: "FOR TIME", COUNTDOWN: "COUNTDOWN", COUNT_UP: "COUNT UP" };
  var lang = (navigator.language || "it").slice(0, 2).toLowerCase();
  var t = UI[lang] || UI.en;
  document.documentElement.lang = UI[lang] ? lang : "en";

  var app = document.getElementById("app");
  var guide = document.getElementById("guide");
  guide.textContent = t.guide;
  guide.href = "../guida/?lang=" + document.documentElement.lang;

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function time(seconds) {
    if (seconds == null) return "";
    if (seconds % 60 === 0) return (seconds / 60) + "'";
    var m = Math.floor(seconds / 60), s = seconds % 60;
    return m > 0 ? m + "'" + (s < 10 ? "0" : "") + s + "\"" : s + "\"";
  }
  function header(kicker) {
    app.appendChild(el("p", "kicker", kicker));
  }
  function fail(message) {
    header(t.kicker);
    app.appendChild(el("p", "error", message));
    var get = el("a", "btn primary", t.get);
    get.href = PLAY;
    var actions = el("div", "actions");
    actions.style.marginTop = "16px";
    actions.appendChild(get);
    app.appendChild(actions);
  }

  function decode(code) {
    var b64 = code.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).text().then(JSON.parse);
  }

  function dose(e) {
    var parts = [];
    if (e.r) parts.push(/^max/i.test(e.r) ? "Max" : e.r);
    if (e.ca) parts.push(e.ca + " cal");
    if (e.m) parts.push(e.m + " m");
    if (e.ts) parts.push(time(e.ts));
    return parts.join(" · ");
  }
  function load(e) {
    if (e.rm || e.rf) return "@ " + [e.rm, e.rf].filter(Boolean).join("/");
    if (e.kg) return "@ " + e.kg + " kg";
    return "";
  }

  function render(wod, code) {
    header(t.kicker);
    app.appendChild(el("h1", null, wod.n || "WOD"));
    document.title = "IRON WOD · " + (wod.n || "WOD");
    app.appendChild(el("p", "lead", t.lead));

    var actions = el("div", "actions");
    var open = el("a", "btn primary", t.open);
    open.href = "intent://wod?d=" + code + "#Intent;scheme=ironwod;S.browser_fallback_url=" + encodeURIComponent(PLAY) + ";end";
    var get = el("a", "btn", t.get);
    get.href = PLAY;
    actions.appendChild(open);
    actions.appendChild(get);
    app.appendChild(actions);

    if (wod.no) app.appendChild(el("p", "notes", wod.no));

    (wod.b || []).forEach(function (b) {
      var card = el("section", "block" + (b.rest ? " rest" : ""));
      var head = el("div", "block-head");
      if (b.rest) {
        head.appendChild(el("span", "type", t.rest));
        if (b.d) head.appendChild(el("span", "meta", time(b.d)));
      } else {
        if (b.l) head.appendChild(el("span", "label", b.l));
        head.appendChild(el("span", "type", TYPES[b.t] || b.t || ""));
        var meta = [];
        if (b.t === "EMOM" && b.i && b.i !== 60) meta.push(t.every + " " + time(b.i));
        if (b.r) meta.push(t.rounds(b.r));
        if (b.d && b.t !== "FOR_TIME") meta.push(time(b.d));
        if (b.w) meta.push(time(b.w) + " " + t.work);
        if (b.rs) meta.push(time(b.rs) + " " + t.off);
        if (b.tc) meta.push(t.cap + " " + time(b.tc));
        if (b.ra) meta.push(t.restAfter + " " + time(b.ra));
        if (b.wait) meta.push(t.wait);
        if (meta.length) head.appendChild(el("span", "meta", meta.join(" · ")));
      }
      card.appendChild(head);
      if (b.no) card.appendChild(el("p", "notes", b.no));
      var list = el("ul");
      (b.e || []).forEach(function (e) {
        var item = el("li");
        var d = dose(e);
        if (d) { item.appendChild(el("span", "dose", d)); item.appendChild(document.createTextNode(" ")); }
        item.appendChild(document.createTextNode(e.n || ""));
        var l = load(e);
        if (l) item.appendChild(document.createTextNode(" " + l));
        if (e.no) item.appendChild(el("span", "note", e.no));
        list.appendChild(item);
      });
      if (list.childNodes.length) card.appendChild(list);
      app.appendChild(card);
    });
  }

  var code = (location.hash || "").replace(/^#/, "");
  if (!/^[A-Za-z0-9_-]+$/.test(code)) {
    fail(t.bad);
    return;
  }
  // Very old browser: no preview, but the WOD can still be opened in the app.
  if (typeof DecompressionStream === "undefined") {
    render({ n: "WOD", b: [] }, code);
    return;
  }
  decode(code).then(function (wod) {
    if (!wod || typeof wod.v !== "number") throw new Error("not a WOD");
    if (wod.v > 1) { fail(t.old); return; }
    render(wod, code);
  }).catch(function () { fail(t.bad); });
})();
</script>
</body>
</html>
